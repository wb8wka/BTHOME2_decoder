name: Build BTHome2 Decoder APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build BTHome2 Decoder debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload BTHome2 Decoder APK
        uses: actions/upload-artifact@v4
        with:
          name: BTHome2-Decoder-APK
          path: app/build/outputs/apk/debug/BTHome2-Decoder-debug.apk
